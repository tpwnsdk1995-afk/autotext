<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수령/반납 리포트</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  button { padding: 8px 14px; font-size: 0.95rem; cursor: pointer; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .settings-grid { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: center; max-width: 460px; }
  .settings-grid input { padding: 6px; font-size: 0.9rem; }
  .muted { color: #888; font-size: 0.85rem; }
  .status-ok { color: #2a7d2a; }
  .status-bad { color: #c33; }
  .primary { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
  th, td { border: 1px solid #8884; padding: 4px 6px; text-align: left; }
  th { background: #8881; }
  td input, td select { width: 100%; box-sizing: border-box; font-size: 0.85rem; padding: 3px; border: 1px solid transparent; background: transparent; }
  td input:focus, td select:focus { border-color: #8888; background: #fff2; }
  tr.type-반납 { background: #ffefefaa; }
  .del-btn { background: none; border: none; color: #c33; cursor: pointer; }
  .table-wrap { overflow-x: auto; }
  .badge-error { color: #c33; font-weight: 600; }
</style>
</head>
<body>

<h1>수령/반납 리포트</h1>

<h2>1. 표 사진 넣기</h2>
<p class="muted">대여/반납 관리 표를 캡처한 사진을 선택하거나 붙여넣기(Ctrl+V)/드래그하면 자동으로 표를 읽어옵니다.</p>
<div class="row">
  <button id="pickImageBtn" class="primary">사진 선택</button>
  <input type="file" id="imageFileInput" accept="image/*" capture="environment" style="display:none;">
  <span id="extractStatus" class="muted"></span>
</div>
<div id="dropZone" class="muted" style="border:1px dashed #8886; border-radius:6px; padding:14px; text-align:center;">
  여기에 이미지를 붙여넣거나(Ctrl+V) 끌어다 놓아도 됩니다
</div>

<h2>2. 설정</h2>
<div class="settings-grid">
  <label for="apiKey">Claude API 키</label><input type="password" id="apiKey" placeholder="sk-ant-...">
  <label for="dataGoKrKey">항공편 서비스키</label><input type="password" id="dataGoKrKey" placeholder="data.go.kr 서비스키">
</div>
<p class="muted">두 값 모두 이 기기의 브라우저에만 저장되며, 해당 API로 직접 전송됩니다.</p>

<h2>3. 리포트 (<span id="countLabel">0건</span>)</h2>
<div class="row">
  <button id="lookupAllBtn">반납 항공편 전체 조회</button>
  <button id="clearAllBtn">모두 삭제</button>
  <button id="copyBtn">텍스트로 복사</button>
  <span id="lookupStatus" class="muted"></span>
</div>
<div class="table-wrap">
<table id="reportTable">
  <thead>
    <tr>
      <th>NO</th>
      <th>수령/반납</th>
      <th>이름</th>
      <th>전화번호</th>
      <th>예약시간</th>
      <th>반납 실제시간</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="reportBody"></tbody>
</table>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "reportToolSettings";

  const els = {
    pickImageBtn: document.getElementById("pickImageBtn"),
    imageFileInput: document.getElementById("imageFileInput"),
    dropZone: document.getElementById("dropZone"),
    extractStatus: document.getElementById("extractStatus"),
    apiKey: document.getElementById("apiKey"),
    dataGoKrKey: document.getElementById("dataGoKrKey"),
    countLabel: document.getElementById("countLabel"),
    lookupAllBtn: document.getElementById("lookupAllBtn"),
    clearAllBtn: document.getElementById("clearAllBtn"),
    copyBtn: document.getElementById("copyBtn"),
    lookupStatus: document.getElementById("lookupStatus"),
    body: document.getElementById("reportBody"),
  };

  /** rows: [{ type, name, phone, reservedTime, flight, actualTime, status }] */
  let rows = [];

  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (s.apiKey) els.apiKey.value = s.apiKey;
      if (s.dataGoKrKey) els.dataGoKrKey.value = s.dataGoKrKey;
    } catch (e) { /* 무시 */ }
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      apiKey: els.apiKey.value.trim(),
      dataGoKrKey: els.dataGoKrKey.value.trim(),
    }));
  }

  [els.apiKey, els.dataGoKrKey].forEach((el) => el.addEventListener("change", saveSettings));
  loadSettings();

  function render() {
    els.body.innerHTML = "";
    rows.forEach((row, idx) => {
      const tr = document.createElement("tr");
      tr.className = row.type === "반납" ? "type-반납" : "";

      const noCell = document.createElement("td");
      noCell.textContent = idx + 1;

      const typeCell = document.createElement("td");
      const typeSelect = document.createElement("select");
      ["수령", "반납"].forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t;
        if (row.type === t) opt.selected = true;
        typeSelect.appendChild(opt);
      });
      typeSelect.addEventListener("change", () => { row.type = typeSelect.value; render(); });
      typeCell.appendChild(typeSelect);

      const nameCell = document.createElement("td");
      const nameInput = document.createElement("input");
      nameInput.value = row.name || "";
      nameInput.addEventListener("input", () => { row.name = nameInput.value; });
      nameCell.appendChild(nameInput);

      const phoneCell = document.createElement("td");
      const phoneInput = document.createElement("input");
      phoneInput.value = row.phone || "";
      phoneInput.addEventListener("input", () => { row.phone = phoneInput.value; });
      phoneCell.appendChild(phoneInput);

      const timeCell = document.createElement("td");
      const timeInput = document.createElement("input");
      timeInput.value = row.reservedTime || "";
      timeInput.addEventListener("input", () => { row.reservedTime = timeInput.value; });
      timeCell.appendChild(timeInput);

      const actualCell = document.createElement("td");
      if (row.status === "error") {
        actualCell.innerHTML = '<span class="badge-error">에러</span>';
      } else {
        actualCell.textContent = row.actualTime || (row.type === "반납" ? "-" : "");
      }

      const delCell = document.createElement("td");
      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => {
        rows = rows.filter((r) => r !== row);
        render();
      });
      delCell.appendChild(delBtn);

      tr.appendChild(noCell);
      tr.appendChild(typeCell);
      tr.appendChild(nameCell);
      tr.appendChild(phoneCell);
      tr.appendChild(timeCell);
      tr.appendChild(actualCell);
      tr.appendChild(delCell);
      els.body.appendChild(tr);
    });
    els.countLabel.textContent = `${rows.length}건`;
  }

  // ---------- 이미지 -> Claude API 추출 ----------
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function extractFromImage(file) {
    const apiKey = els.apiKey.value.trim();
    if (!apiKey) {
      alert("Claude API 키를 먼저 입력해주세요.");
      return;
    }
    els.extractStatus.textContent = "표 읽는 중... (몇 초~수십 초 걸릴 수 있습니다)";
    try {
      const imageBase64 = await fileToBase64(file);
      const res = await fetch("/api/extract-report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey, imageBase64, mediaType: file.type || "image/png" }),
      });
      const data = await res.json();
      if (!data.ok) {
        els.extractStatus.textContent = "";
        alert(`추출 실패: ${data.error || "알 수 없는 오류"}`);
        return;
      }
      const existingKeys = new Set(rows.map((r) => `${r.name}|${r.phone}`));
      const newRows = [];
      let skipped = 0;
      for (const r of data.rows) {
        const name = r.name || "";
        const phone = r.phone || "";
        const key = `${name}|${phone}`;
        if (existingKeys.has(key)) { skipped++; continue; }
        existingKeys.add(key);
        newRows.push({
          type: (r.type && String(r.type).includes("반납")) ? "반납" : "수령",
          name,
          phone,
          reservedTime: r.reservedTime || "",
          flight: r.flight || null,
          actualTime: "",
          status: "",
        });
      }
      rows = rows.concat(newRows);
      els.extractStatus.textContent = `${newRows.length}건 추출 완료` + (skipped ? ` (중복 ${skipped}건 제외)` : "") + " — 아래 표를 확인해주세요";
      render();
    } catch (e) {
      els.extractStatus.textContent = "";
      alert(`오류: ${e.message || e}`);
    }
  }

  els.pickImageBtn.addEventListener("click", () => els.imageFileInput.click());
  els.imageFileInput.addEventListener("change", () => {
    const file = els.imageFileInput.files[0];
    if (file) extractFromImage(file);
    els.imageFileInput.value = "";
  });

  function extractImageFile(dataTransferOrClipboard) {
    const items = dataTransferOrClipboard.items;
    if (items) {
      for (const item of items) {
        if (item.kind === "file" && item.type.startsWith("image/")) return item.getAsFile();
      }
    }
    const files = dataTransferOrClipboard.files;
    if (files && files.length && files[0].type.startsWith("image/")) return files[0];
    return null;
  }

  document.addEventListener("paste", (e) => {
    const file = extractImageFile(e.clipboardData);
    if (file) { e.preventDefault(); extractFromImage(file); }
  });

  els.dropZone.addEventListener("dragover", (e) => { e.preventDefault(); els.dropZone.style.background = "#8882"; });
  els.dropZone.addEventListener("dragleave", () => { els.dropZone.style.background = ""; });
  els.dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    els.dropZone.style.background = "";
    const file = extractImageFile(e.dataTransfer);
    if (file) extractFromImage(file);
  });

  // ---------- 항공편 조회 ----------
  async function lookupFlight(flight) {
    const serviceKey = els.dataGoKrKey.value.trim();
    const res = await fetch(`/api/flight-arrival?serviceKey=${encodeURIComponent(serviceKey)}&flightId=${encodeURIComponent(flight)}`);
    return res.json();
  }

  els.lookupAllBtn.addEventListener("click", async () => {
    const serviceKey = els.dataGoKrKey.value.trim();
    if (!serviceKey) {
      alert("항공편 서비스키를 먼저 입력해주세요.");
      return;
    }
    const targets = rows.filter((r) => r.type === "반납" && r.flight);
    if (targets.length === 0) {
      alert("항공편 정보가 있는 반납 건이 없습니다.");
      return;
    }
    els.lookupAllBtn.disabled = true;
    let done = 0;
    for (const row of targets) {
      els.lookupStatus.textContent = `조회 중... ${done + 1}/${targets.length}`;
      try {
        const data = await lookupFlight(row.flight);
        if (!data.ok) {
          row.status = "error";
        } else if (!data.found) {
          row.status = "error";
        } else {
          const item = data.item;
          row.actualTime = item.estimatedDateTime || item.scheduleDateTime || "";
          row.status = row.actualTime ? "ok" : "error";
        }
      } catch (e) {
        row.status = "error";
      }
      done++;
      render();
    }
    els.lookupStatus.textContent = `완료 (${done}/${targets.length})`;
    els.lookupAllBtn.disabled = false;
  });

  els.clearAllBtn.addEventListener("click", () => {
    if (rows.length === 0) return;
    if (!confirm(`${rows.length}건을 모두 삭제할까요?`)) return;
    rows = [];
    render();
  });

  els.copyBtn.addEventListener("click", async () => {
    const lines = rows.map((r) =>
      [r.type, r.name, r.phone, r.reservedTime, r.type === "반납" ? (r.status === "error" ? "에러" : r.actualTime || "") : ""].join(" / ")
    );
    const text = lines.join("\n");
    try {
      await navigator.clipboard.writeText(text);
      els.lookupStatus.textContent = "클립보드에 복사했습니다";
    } catch (e) {
      alert(text);
    }
  });

  render();
})();
</script>
</body>
</html>
